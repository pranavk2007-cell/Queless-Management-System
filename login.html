```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queueless - Login & Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #153e75, #4f8edc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #153e75;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            margin-bottom: 22px;
            background: #edf3fa;
            border-radius: 8px;
            padding: 4px;
        }

        .tabs button {
            width: 50%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            background: transparent;
        }

        .tabs button.active {
            background: #153e75;
            color: white;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd4df;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #8bb8f0;
            border-color: #153e75;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #153e75;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #245ba0;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #153e75;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Queueless</h1>
    <p class="subtitle">Skip the Queue. Save Your Time.</p>

    <div class="tabs">
        <button id="loginTab" class="active"
                onclick="showForm('login')">Login</button>

        <button id="registerTab"
                onclick="showForm('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm">

        <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword"
                   placeholder="Enter your password" required>
        </div>

        <button type="submit" class="submit-btn">
            Login
        </button>

    </form>

    <!-- REGISTRATION FORM -->
    <form id="registerForm" class="hidden">

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName"
                   placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter your phone number"
                   pattern="[0-9]{10}"
                   maxlength="10" required>
        </div>

        <div class="form-group">
            <label for="registerPassword">Create Password</label>
            <input type="password" id="registerPassword"
                   placeholder="At least 8 characters"
                   minlength="8" required>
        </div>

        <div class="form-group">
            <label for="userType">Choose User Type</label>
            <select id="userType" required>
                <option value="">Select an option</option>
                <option value="Hospital">Hospital</option>
                <option value="College">College</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">
            Create Account
        </button>

    </form>

    <p id="message" class="message"></p>

    <a href="index.html" class="back-link">
        ← Back to Home
    </a>

</div>

<script>
    function showForm(type) {
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");
        const message = document.getElementById("message");

        message.textContent = "";

        if (type === "login") {
            loginForm.classList.remove("hidden");
            registerForm.classList.add("hidden");

            loginTab.classList.add("active");
            registerTab.classList.remove("active");
        } else {
            registerForm.classList.remove("hidden");
            loginForm.classList.add("hidden");

            registerTab.classList.add("active");
            loginTab.classList.remove("active");
        }
    }

    document.getElementById("registerForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("message").textContent =
                "Registration form completed! Account creation " +
                "will be enabled after connecting a backend.";

            document.getElementById("message").style.color = "#245ba0";
        });

    document.getElementById("loginForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("message").textContent =
                "Login interface is ready. Authentication will be " +
                "enabled after connecting a backend.";

            document.getElementById("message").style.color = "#245ba0";
        });
</script>

</body>
</html>
